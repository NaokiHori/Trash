<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Logo generator</title>
    <script type="module" src="./src/main.ts"></script>
  </head>

  <body>
    <button id="download-open" type="button">Download</button>
    <dialog id="download-dialog">
      <form id="download-form" method="dialog">
        <h2>Download image</h2>
        <fieldset>
          <legend>Format</legend>
          <label>
            <input type="radio" name="format" value="jpg" checked />
            JPG
          </label>
          <label>
            <input type="radio" name="format" value="png" />
            PNG
          </label>
          <label>
            <input type="radio" name="format" value="svg" />
            SVG
          </label>
        </fieldset>
        <fieldset id="size-fieldset">
          <legend>Size (px)</legend>
          <label>
            <input
              type="number"
              id="size-input"
              name="size"
              value="512"
              min="128"
              max="8192"
              step="1"
            />
          </label>
        </fieldset>
        <div class="dialog-actions">
          <button type="button" id="download-cancel">Cancel</button>
          <button type="submit" id="download-confirm" value="download">Download</button>
        </div>
      </form>
    </dialog>
    <svg id="graph" viewBox="-50 -50 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    <footer>
      <a href="https://github.com/NaokiHori/Trash/tree/main/Logo">&#xA9; 2026 Naoki Hori</a>
    </footer>
  </body>
</html>
