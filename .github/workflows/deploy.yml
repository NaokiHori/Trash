name: Deploy

on:
  workflow_dispatch: {}

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: Scan images
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.0
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker build -t app .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'app'
          severity: 'CRITICAL'
          exit-code: '1'
  build:
    name: Build
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ARTIFACT: "./dist"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.0
        with:
          persist-credentials: false
      - name: Build Docker image
        run: make build-image
      - name: Perform quality checks and build artifacts
        run: |
          make polish
          make build \
            ARTIFACT=${{ env.ARTIFACT }}
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ env.ARTIFACT }}
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
