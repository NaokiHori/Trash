name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      CONTAINER_DIST: "/project/dist"
      CONTAINER_NAME: "container_trash"
      CONTAINER_USER: "node"
      HOST_DIST: "./dist"
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Build Docker image
        run: docker compose build app
      - name: Quality checks
        run: |
          docker compose up -d app
          docker compose exec -u "${{ env.CONTAINER_USER }}" app npx tsc
          docker compose exec -u "${{ env.CONTAINER_USER }}" app npx oxlint
          docker compose exec -u "${{ env.CONTAINER_USER }}" app npx oxfmt --check
          docker compose down
      - name: Build
        run: |
          docker compose up -d app
          docker compose exec -u "${{ env.CONTAINER_USER }}" app npx \
            vite build \
            --emptyOutDir \
            --outDir=${{ env.CONTAINER_DIST }} \
            --base=https://naokihori.github.io/Trash/
          docker cp "${{ env.CONTAINER_NAME }}:${{ env.CONTAINER_DIST }}" "${{ env.HOST_DIST }}"
          docker compose down
      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.HOST_DIST }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
