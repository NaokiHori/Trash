name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: Scan images
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Build and scan images
        run: |
          docker build -t app .
          cd scan
          mkdir -p tmp
          docker save app -o tmp/image.tar
          #
          docker build -t scan .
          docker run \
            --rm \
            -v "${PWD}/tmp":/workspace:ro \
            scan \
            image \
            --no-progress \
            --severity CRITICAL \
            --exit-code 1 \
            --input /workspace/image.tar
  build:
    name: Build
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ARTIFACT_BASE: "https://naokihori.github.io/Trash/"
      ARTIFACT_DESTINATION: "./dist"
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Build Docker image
        run: make build-image
      - name: Perform quality checks and build artifacts
        run: |
          make polish
          make build \
            ARTIFACT_BASE=${{ env.ARTIFACT_BASE }} \
            ARTIFACT_DESTINATION=${{ env.ARTIFACT_DESTINATION }}
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.ARTIFACT_DESTINATION }}
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
